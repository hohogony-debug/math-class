<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유리함수의 그래프</title>
<style>
  :root { --bg:#070b16; --panel:rgba(16,23,44,.93); --edge:rgba(120,150,210,.25); --txt:#e8eefc; --sub:#8c9bbd;
          --pos:#4fe3ff; --neg:#ff6fb5; --asym:#ffb547; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:"Malgun Gothic","맑은 고딕",sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .top { position:fixed; left:28px; top:20px; display:flex; align-items:center; gap:18px; z-index:2; }
  .top h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:1px; color:#cfd9f2; }
  .tabs { display:flex; background:var(--panel); border:1px solid var(--edge); border-radius:999px; padding:4px; }
  .tabs button { font:inherit; font-size:16px; color:var(--sub); background:none; border:0; padding:7px 18px; border-radius:999px; cursor:pointer; transition:.25s; }
  .tabs button.on { background:#e8eefc; color:#0b1020; font-weight:700; }
  .eq { position:fixed; left:24px; top:72px; z-index:2; font-family:"Cambria Math","Times New Roman",serif; font-size:48px;
        padding:6px 30px; border-radius:18px; background:rgba(7,11,22,.85); white-space:nowrap; text-shadow:0 0 18px rgba(120,200,255,.25); }
  .eq i { font-style:italic; }
  .frac { display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 6px; line-height:1.05; }
  .frac > span:first-child { border-bottom:3px solid currentColor; padding:0 8px 2px; }
  .kc { transition:color .3s; }
  .pc { color:var(--asym); }
  aside { position:fixed; right:22px; top:90px; width:330px; z-index:2; background:var(--panel); border:1px solid var(--edge); border-radius:20px;
          padding:18px 20px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .ctl { margin-bottom:14px; }
  .ctl .lab { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; color:var(--sub); }
  .ctl .lab b { font-family:"Cambria Math","Times New Roman",serif; font-size:30px; color:var(--txt); font-weight:400; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px; background:linear-gradient(90deg,var(--neg),#333c58 50%,var(--pos)); outline:none; margin:8px 0 4px; }
  input[type=range].plain { background:#333c58; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 0 14px rgba(255,255,255,.8); cursor:pointer; }
  .btns { display:flex; flex-wrap:wrap; gap:7px; }
  .btns button { font:inherit; font-size:14.5px; color:var(--txt); background:rgba(255,255,255,.06); border:1px solid var(--edge); border-radius:12px; padding:7px 12px; cursor:pointer; transition:.2s; }
  .btns button:hover { background:rgba(255,255,255,.14); }
  .btns button.on { background:#e8eefc; color:#0b1020; border-color:#e8eefc; font-weight:700; }
  .btns button.go { flex:1; }
  .info { margin-top:14px; border-top:1px solid var(--edge); padding-top:12px; font-size:15px; line-height:1.9; }
  .info div { display:flex; justify-content:space-between; gap:10px; }
  .info span:first-child { color:var(--sub); }
  .info i { font-family:"Cambria Math","Times New Roman",serif; font-size:1.1em; }
  .big { position:fixed; left:calc(50% - 175px); bottom:34px; transform:translateX(-50%); z-index:2; font-size:26px; font-weight:700; letter-spacing:1px;
         padding:10px 26px; border-radius:16px; background:rgba(7,11,22,.6); border:1px solid var(--edge); opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap; }
  .big.show { opacity:1; }
  .hide { display:none !important; }
  .tbl { position:fixed; left:24px; top:150px; z-index:2; background:var(--panel); border:1px solid var(--edge); border-radius:16px; padding:10px 14px; font-family:"Cambria Math","Times New Roman",serif; font-size:19px; min-width:190px; }
  .tbl table { border-collapse:collapse; width:100%; }
  .tbl th { font-style:italic; font-weight:400; color:var(--sub); border-bottom:1px solid var(--edge); padding:2px 10px; }
  .tbl td { text-align:center; padding:2px 10px; transition:background .3s, color .3s; }
  .tbl td:first-child { border-right:1px solid var(--edge); }
  .tbl tr.now td { background:rgba(255,255,255,.14); color:#fff; }
  .tbl tr.wait td { color:transparent; }
  .hint { position:fixed; left:28px; bottom:18px; font-size:13px; color:#56628a; z-index:2; }

  @media (max-width:899px) {
    .top { left:12px; top:10px; gap:10px; } .top h1 { font-size:16px; }
    .tabs button { font-size:13px; padding:5px 10px; }
    .eq { left:10px; top:50px; font-size:26px; padding:4px 12px; }
    aside { left:0; right:0; top:auto; bottom:0; width:auto; max-height:40vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:12px 14px; }
    .ctl { margin-bottom:8px; } .ctl .lab b { font-size:22px; }
    .btns button { font-size:13px; padding:6px 9px; }
    .info { font-size:13px; line-height:1.7; }
    .hint { display:none; }
    .big { left:50%; bottom:calc(40vh + 10px); font-size:15px; padding:7px 14px; white-space:normal; width:90vw; text-align:center; }
    .tbl { top:118px !important; left:8px; font-size:14px !important; min-width:0; padding:6px 8px; }
    .stepbar { bottom:calc(40vh + 12px) !important; } .stepbar button { font-size:15px !important; padding:9px 13px !important; }
    .big { bottom:calc(40vh + 70px) !important; }
  }

  @media (max-height:860px) and (min-width:900px) {
    aside { top:70px; padding:12px 16px; max-height:calc(100vh - 80px); overflow-y:auto; }
    .ctl { margin-bottom:8px; } .ctl .lab b { font-size:24px; }
    .btns button { padding:5px 10px; font-size:14px; }
    .info { margin-top:8px; padding-top:8px; font-size:14px; line-height:1.6; }
    .eq { font-size:38px; top:64px; }
    .tbl { top:150px; font-size:16px; padding:6px 10px; } .tbl td { padding:1px 8px; }
  }
  canvas { touch-action:none; }
  .stepbar { position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:3; display:flex; gap:10px; }
  .stepbar button { font:inherit; font-size:18px; font-weight:700; color:#0b1020; background:#e8eefc; border:0; border-radius:14px; padding:12px 20px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  .stepbar button.ghost { background:rgba(18,26,48,.85); color:#e8eefc; border:1px solid var(--edge); }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="top">
  <h1>유리함수의 그래프</h1>
  <div class="tabs"><button id="t1" class="on">y = k/x</button><button id="t2">평행이동</button></div>
</div>
<div class="eq" id="eq"></div>
<div class="big" id="big"></div>
<div class="tbl hide" id="tbl"></div>
<div class="stepbar hide" id="stepbar"><button class="ghost" id="sPrev">◀ 이전 점</button><button id="sPause">일시정지 ‖</button><button class="ghost" id="sNext">다음 점 ▶</button></div>

<aside>
  <div class="ctl">
    <div class="lab"><span>k</span><b id="kv"></b></div>
    <input type="range" id="k" min="-8" max="8" step="0.5" value="1">
    <div class="btns">
      <button data-k="-4">−4</button><button data-k="-1">−1</button><button data-k="1">1</button><button data-k="4">4</button><button data-k="8">8</button>
    </div>
  </div>
  <div id="pqBox" class="hide">
    <div class="ctl"><div class="lab"><span>p · x축 방향</span><b id="pv"></b></div><input type="range" class="plain" id="p" min="-5" max="5" step="0.5" value="0"></div>
    <div class="ctl"><div class="lab"><span>q · y축 방향</span><b id="qv"></b></div><input type="range" class="plain" id="q" min="-4" max="4" step="0.5" value="0"></div>
  </div>
  <div class="btns">
    <button class="go" id="sweep">k 움직이기</button>
    <button class="go" id="family">곡선 가족</button>
    <button class="go hide" id="slide">평행이동 ▶</button>
  </div>
  <div class="btns" style="margin-top:7px">
    <button class="go" id="rect">넓이 직사각형</button>
    <button class="go on" id="trail">잔상</button>
    <button class="go" id="clear">지우기</button>
  </div>
  <div class="btns" style="margin-top:7px">
    <button class="go" id="plot">점 찍어 그리기 ▶</button></div>
  <div class="btns" style="margin-top:7px">
    <button class="go" id="asym">점근선 보기</button>
    <button id="zin">＋</button><button id="zout">－</button><button id="zreset">1:1</button>
  </div>
  <div class="info" id="info"></div>
</aside>
<div class="hint">← → 키: k 조절 · P: 점 찍기 시작/멈춤 · 마우스 휠: 확대/축소 · F: 전체 화면 · Space: k 움직이기</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("cv"); let ctx = cv.getContext("2d", { alpha: false });
const POS = "#4fe3ff", NEG = "#ff6fb5", ASY = "#ffb547";
let MOB = false, RE = 0, BE = 0;
let W, H, S, ox, oy, dpr;
let mode = 1;
let K = 1, Kt = 1, P = 0, Pt = 0, Q = 0, Qt = 0;
let sweeping = false, sweepT = 0, familyT = -1, rectOn = false, trailOn = true;
let trails = [], frame = 0, lastSnap = null, rideU = 0, bigTimer = null;
let S0 = 40, Z = 1, Zt = 1, probeOn = false;
let plot = null;   // 점 찍어 그리기 상태

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  MOB = W < 900; RE = MOB ? W : W - 370; BE = MOB ? H * 0.6 : H;
  if (MOB) { S0 = Math.min(W, BE - 90) / 14; ox = W / 2; oy = (BE + 90) / 2; }
  else { S0 = Math.min(W - 380, H) / 19; ox = (W - 360) / 2 + 10; oy = H / 2 + 30; }
  S = S0 * Z;
}
const X = x => ox + x * S, Y = y => oy - y * S;
const xmin = () => -ox / S, xmax = () => (W - ox) / S, ymin = () => -(H - oy) / S, ymax = () => oy / S;
const fmt = v => { const a = Math.abs(Math.round(v * 2) / 2); return (v < -0.001 && a ? "−" : "") + (Number.isInteger(a) ? a : a.toFixed(1)); };
const colorOf = k => k >= 0 ? POS : NEG;

function curvePath(k, p, q, n = 300) {
  const paths = [];
  for (const side of [-1, 1]) {
    const pts = [], a = side < 0 ? xmin() - 1 : p, b = side < 0 ? p : xmax() + 1;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = side < 0 ? p - (p - a) * Math.pow(1 - t, 3) - 1e-4 : p + (b - p) * Math.pow(t, 3) + 1e-4;
      const y = k / (x - p) + q;
      if (y < ymin() - 3 / Z || y > ymax() + 3 / Z) { if (pts.length > 1) paths.push(pts.splice(0)); else pts.length = 0; continue; }
      pts.push([X(x), Y(y)]);
    }
    if (pts.length > 1) paths.push(pts);
  }
  return paths;
}
function stroke(paths, color, width, alpha, glow, dash) {
  // 그림자 흐림(shadowBlur) 대신 넓고 옅은 선을 겹쳐 빛나 보이게 함 → 교실 PC·패드에서도 가볍게
  ctx.save(); ctx.strokeStyle = color; ctx.lineJoin = ctx.lineCap = "round";
  if (dash) ctx.setLineDash(dash);
  const draw = () => { for (const pts of paths) { if (pts.length < 2) continue; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); } };
  if (glow) { ctx.globalAlpha = alpha * .10; ctx.lineWidth = width + glow * .9; draw(); ctx.globalAlpha = alpha * .22; ctx.lineWidth = width + glow * .35; draw(); }
  ctx.globalAlpha = alpha; ctx.lineWidth = width; draw();
  ctx.restore();
}

function glowDot(x, y, r, color, core = color) {   // shadowBlur 없이 빛나는 점
  const a = ctx.globalAlpha; ctx.fillStyle = color;
  ctx.globalAlpha = a * .14; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 7); ctx.fill();
  ctx.globalAlpha = a * .3; ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 7); ctx.fill();
  ctx.globalAlpha = a; ctx.fillStyle = core; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
// 배경(모눈·축·눈금)은 바뀔 때만 따로 그려 두고 매 장면엔 붙이기만 함
const bg = document.createElement("canvas"), bgx = bg.getContext("2d"); let bgKey = "";
function drawGrid() {
  const key = [W, H, dpr, S, ox, oy, P, Q, mode, MOB].join();
  if (key !== bgKey) {
    bgKey = key;
    if (bg.width !== cv.width || bg.height !== cv.height) { bg.width = cv.width; bg.height = cv.height; }
    bgx.setTransform(dpr, 0, 0, dpr, 0, 0); const c0 = ctx; ctx = bgx; drawGrid0(); ctx = c0;
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0); ctx.restore();
}
function drawGrid0() {
  ctx.fillStyle = "#070b16"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(X(P), Y(Q), 0, X(P), Y(Q), Math.max(W, H) * .7);
  g.addColorStop(0, "rgba(40,60,120,.28)"); g.addColorStop(1, "rgba(7,11,22,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 1;
  const steps = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500];
  const st = steps.find(v => v * S >= 26) || 500, lab = steps.find(v => v * S >= 60) || 500;
  for (let x = Math.ceil(xmin() / st) * st; x <= xmax(); x += st) { ctx.strokeStyle = Math.abs(x / lab - Math.round(x / lab)) < 1e-6 ? "rgba(90,115,170,.22)" : "rgba(90,115,170,.10)"; ctx.beginPath(); ctx.moveTo(X(x), 0); ctx.lineTo(X(x), H); ctx.stroke(); }
  for (let y = Math.ceil(ymin() / st) * st; y <= ymax(); y += st) { ctx.strokeStyle = Math.abs(y / lab - Math.round(y / lab)) < 1e-6 ? "rgba(90,115,170,.22)" : "rgba(90,115,170,.10)"; ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(W, Y(y)); ctx.stroke(); }
  ctx.strokeStyle = "rgba(200,215,245,.55)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), H); ctx.stroke();
  ctx.fillStyle = "rgba(170,185,220,.6)"; ctx.font = "13px 'Times New Roman'"; ctx.textAlign = "center";
  for (let x = Math.ceil(xmin() / lab) * lab; x <= xmax(); x += lab) if (Math.abs(x) > 1e-9) ctx.fillText(+x.toFixed(1), X(x), Y(0) + 17);
  ctx.textAlign = "right";
  for (let y = Math.ceil(ymin() / lab) * lab; y <= ymax(); y += lab) if (Math.abs(y) > 1e-9) ctx.fillText(+y.toFixed(1), X(0) - 7, Y(y) + 4);
  ctx.fillText("O", X(0) - 6, Y(0) + 17);
  ctx.font = "italic 20px 'Times New Roman'"; ctx.fillStyle = "rgba(220,230,250,.85)"; ctx.textAlign = "left";
  ctx.fillText("x", RE - 22, Y(0) - 9); ctx.fillText("y", X(0) + 9, MOB ? 100 : 96);
}

function drawAsymptotes() {
  ctx.save(); ctx.setLineDash([10, 8]); ctx.lineWidth = 1.8; ctx.strokeStyle = ASY;
  ctx.globalAlpha = mode === 2 ? .95 : .4;
  ctx.beginPath(); ctx.moveTo(X(P), 0); ctx.lineTo(X(P), H); ctx.moveTo(0, Y(Q)); ctx.lineTo(W, Y(Q)); ctx.stroke();
  ctx.restore();
  if (mode === 2) {
    ctx.fillStyle = ASY; ctx.font = "italic 19px 'Times New Roman'";
    ctx.fillText("x = " + fmt(P), X(P) + 8, 122); ctx.fillText("y = " + fmt(Q), 16, Y(Q) - 9);
    const r = 6 + 2 * Math.sin(frame / 12);
    ctx.save(); glowDot(X(P), Y(Q), r, ASY); ctx.restore();
    ctx.fillText(`(${fmt(P)}, ${fmt(Q)})`, X(P) + 12, Y(Q) + 24);
  }
}

function drawRect() {
  // 점근선의 교점과 곡선 위의 점을 마주 보는 꼭짓점으로 하는 직사각형: 넓이가 항상 |k|
  rideU += 0.008 * DT; const u = 0.35 + (Math.sin(rideU) + 1) * 2.4;
  for (const sx of [1, -1]) {
    const x = P + sx * u, y = Q + K / (x - P);
    const x0 = X(P), y0 = Y(Q), x1 = X(x), y1 = Y(y), c = colorOf(K);
    ctx.save(); ctx.fillStyle = c; ctx.globalAlpha = .16; ctx.fillRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    ctx.globalAlpha = .9; ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    ctx.globalAlpha = 1; glowDot(x1, y1, 7, c, "#fff"); ctx.restore();
    if (sx > 0) {
      ctx.fillStyle = "#fff"; ctx.font = "bold 18px 'Malgun Gothic'";
      ctx.fillText(`넓이 = ${Math.abs(x - P).toFixed(2)} × ${Math.abs(y - Q).toFixed(2)} = ${fmt(Math.abs(K))}`, Math.max(x0, x1) + 12, (y0 + y1) / 2);
    }
  }
}

// 곡선 위의 점이 점근선에 한없이 가까워지는 모습: 오른쪽 끝·위(아래) 끝 근처의 점 값 표시
function drawProbe() {
  const c = colorOf(K), f = x => K / (x - P) + Q;
  const fx = xmax() * 0.82, fy = f(fx);                 // 오른쪽으로 멀리
  const ty = (K > 0 ? ymax() : ymin()) * 0.78, tx = P + K / (ty - Q);   // 위(아래)로 멀리
  const pts = [[fx, fy, `x = ${fx.toFixed(fx > 20 ? 0 : 1)}  →  y = ${fy.toFixed(Math.abs(fy - Q) < .01 ? 4 : 3)}`, "x"],
               [tx, ty, `x = ${tx.toFixed(Math.abs(tx - P) < .01 ? 4 : 3)}  →  y = ${ty.toFixed(ty > 20 ? 0 : 1)}`, "y"]];
  for (const [x, y, t, k] of pts) {
    ctx.save(); ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
    ctx.beginPath();
    if (k === "x") { ctx.moveTo(X(x), Y(y)); ctx.lineTo(X(x), Y(Q)); } else { ctx.moveTo(X(x), Y(y)); ctx.lineTo(X(P), Y(y)); }
    ctx.stroke(); ctx.setLineDash([]);
    glowDot(X(x), Y(y), 6, "#fff"); ctx.restore();
    ctx.font = "bold 17px 'Malgun Gothic'"; ctx.fillStyle = "#fff";
    const w = ctx.measureText(t).width;
    ctx.fillText(t, k === "x" ? Math.min(X(x) - w / 2, RE - 10 - w) : X(x) + 14, k === "x" ? Y(y) + (K > 0 ? -16 : 28) : Y(y) + 6);
  }
}

// ---------- 점 찍어 그리기 ----------
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
function fracStr(n, d) {                     // n/d 를 기약분수 문자열로
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d); n /= g; d /= g;
  const sg = n < 0 ? "−" : ""; n = Math.abs(n);
  return d === 1 ? sg + n : `${sg}${n}/${d}`;
}
function startPlot() {
  stopAll(); probeOn = false; $("asym").classList.remove("on"); zoomTo(1); Z = 1; S = S0; trails = []; rectOn = false; $("rect").classList.remove("on");
  K = Kt; P = Pt; Q = Qt;
  const offs = [[1, 2], [1, 1], [2, 1], [4, 1], [8, 1]];   // x - p = a/b
  const k2 = Math.round(K * 2), p2 = Math.round(P * 2), q2 = Math.round(Q * 2);
  const pts = [];
  for (const side of [1, -1]) for (const [a, b] of (side > 0 ? offs : offs.slice().reverse())) {
    const dx = side * a / b, x = P + dx, y = K / dx + Q;
    if (y < ymin() + .3 || y > ymax() - .6 || X(x) > RE - 60 || X(x) < 10 || Y(y) > BE - 20) continue;
    // x = (p2*b + 2*side*a) / (2b),  y = (k2*b)/(2*side*a) + q2/2 = (k2*b + q2*side*a) / (2*side*a)
    pts.push({ x, y, xs: fracStr(p2 * b + 2 * side * a, 2 * b), ys: fracStr(k2 * b + q2 * side * a, 2 * side * a), side });
  }
  pts.sort((u, v) => u.side !== v.side ? v.side - u.side : u.x - v.x);
  plot = { pts, t: 0, n: 0, paused: false };
  $("tbl").innerHTML = `<table><tr><th>x</th><th>y</th></tr>${pts.map((p, i) => `<tr id="r${i}" class="wait"><td>${p.xs}</td><td>${p.ys}</td></tr>`).join("")}</table>`;
  $("tbl").classList.remove("hide"); $("stepbar").classList.remove("hide"); syncPause();
  $("plot").classList.add("on"); $("plot").textContent = "일시정지 ‖";
  flash(mode === 1 ? "x에 값을 넣어 y를 구하고, 점을 찍어 보자" : "먼저 점근선을 긋고, 점을 찍어 보자");
}
function endPlot() { plot = null; $("tbl").classList.add("hide"); $("stepbar").classList.add("hide"); $("plot").classList.remove("on"); $("plot").textContent = "점 찍어 그리기 ▶"; }
function partialBranch(side, x0, x1) {        // 한 가지(branch)를 x0~x1 까지만
  const pts = [], n = 300;
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = K / (x - P) + Q;
    if (y < ymin() - 3 || y > ymax() + 3) continue;
    pts.push([X(x), Y(y)]);
  }
  return [pts];
}
function drawPlot() {
  const pl = plot, c = colorOf(K), STEP = 50, lead = mode === 2 ? 70 : 20;
  pl.STEP = STEP; pl.lead = lead; pl.doneT = lead + pl.pts.length * STEP + 20;
  if (!pl.paused) pl.t += DT;
  if (pl.paused) { ctx.save(); ctx.font = "bold 22px 'Malgun Gothic'"; ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillText("‖ 일시정지", 24, BE - 50); ctx.restore(); }
  const shown = Math.max(0, Math.min(pl.pts.length, Math.floor((pl.t - lead) / STEP) + 1));
  for (let i = 0; i < pl.pts.length; i++) {
    const r = $("r" + i); if (!r) continue;
    r.className = i < shown - 1 ? "" : i === shown - 1 ? "now" : "wait";
  }
  // 점
  pl.pts.slice(0, shown).forEach((p, i) => {
    const age = pl.t - lead - i * STEP, pop = Math.min(1, age / 14), big = i === shown - 1 && age < STEP;
    const r = 6 + (1 - pop) * 14;
    ctx.save(); ctx.globalAlpha = pop; glowDot(X(p.x), Y(p.y), r, c, "#fff"); ctx.restore();
    if (big) {   // 지금 찍는 점: 좌표 안내선과 라벨
      ctx.save(); ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(X(p.x), Y(Q)); ctx.lineTo(X(p.x), Y(p.y)); ctx.lineTo(X(P), Y(p.y)); ctx.stroke(); ctx.restore();
    }
    ctx.globalAlpha = big ? 1 : .55; ctx.fillStyle = "#fff"; ctx.font = (big ? "bold 18px" : "14px") + " 'Times New Roman'";
    ctx.fillText(`(${p.xs}, ${p.ys})`, X(p.x) + 10, Y(p.y) + (p.y - Q > 0 ? -10 : 20)); ctx.globalAlpha = 1;
  });
  // 모든 점을 찍은 뒤 → 부드럽게 잇기
  const doneT = lead + pl.pts.length * STEP + 20;
  if (pl.t > doneT) {
    const pr = Math.min(1, (pl.t - doneT) / 120), e = 1 - Math.pow(1 - pr, 3);
    const R1 = xmax() + 1, L1 = xmin() - 1;
    stroke(partialBranch(1, P + 1e-3, P + 1e-3 + (R1 - P) * e), c, 3.2, 1, 16);
    stroke(partialBranch(-1, P - 1e-3, P - 1e-3 - (P - L1) * e), c, 3.2, 1, 16);
    if (pr >= 1 && !pl.said) { pl.said = true; flash("점들을 매끄럽게 이으면 완성!"); }
  }
}

const FAMILY = [-8, -6, -4, -3, -2, -1, -0.5, 0.5, 1, 2, 3, 4, 6, 8];
function drawFamily() {
  familyT += 0.012 * DT;
  FAMILY.forEach(k => {
    const order = Math.abs(k) <= 1 ? 0 : Math.abs(k) <= 3 ? 1 : 2;
    const a = Math.max(0, Math.min(1, (familyT - order * 0.6 - (k < 0 ? .3 : 0)) * 2));
    if (!a) return;
    const t = (Math.log2(Math.abs(k)) + 1) / 4;
    const c = k > 0 ? `hsl(${190 - t * 40}, 100%, ${70 - t * 18}%)` : `hsl(${325 + t * 25}, 100%, ${72 - t * 18}%)`;
    stroke(curvePath(k, P, Q), c, 2.2, a * .9, 14);
    if (a > .9 && Math.abs(k) >= 1) {
      const s = Math.sqrt(Math.abs(k)), x = P + s, y = Q + k / s;
      ctx.globalAlpha = a; ctx.fillStyle = c; ctx.font = "italic 15px 'Times New Roman'";
      ctx.fillText("k=" + fmt(k), X(x) + 6, Y(y) + (k > 0 ? -6 : 16)); ctx.globalAlpha = 1;
    }
  });
}

let lastNow = 0, DT = 1;
const ez = r => 1 - Math.pow(1 - r, DT);   // 기기 속도와 상관없이 같은 빠르기로 움직이게
function loop(now) {
  DT = lastNow ? Math.min(3, Math.max(0.25, (now - lastNow) / 16.67)) : 1; lastNow = now;
  frame += DT;
  if (sweeping) {
    sweepT += 0.006 * DT;
    let v = 7.5 * Math.sin(sweepT);
    if (Math.abs(v) < 0.2) v = v < 0 ? -0.2 : 0.2;
    Kt = v; K = v;
  } else {
    K += (Kt - K) * ez(.12); if (Math.abs(Kt - K) < 1e-3) K = Kt;
  }
  Z += (Zt - Z) * ez(.06); if (Math.abs(Zt - Z) < 1e-4) Z = Zt; S = S0 * Z;
  P += (Pt - P) * ez(.05); Q += (Qt - Q) * ez(.05);
  if (Math.abs(Pt - P) < 1e-3) P = Pt; if (Math.abs(Qt - Q) < 1e-3) Q = Qt;

  drawGrid();
  if (mode === 1) {
    ctx.save(); ctx.setLineDash([3, 7]); ctx.strokeStyle = "rgba(170,185,220,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(-30), Y(-30)); ctx.lineTo(X(30), Y(30)); ctx.moveTo(X(-30), Y(30)); ctx.lineTo(X(30), Y(-30)); ctx.stroke(); ctx.restore();
  }
  drawAsymptotes();

  if (familyT >= 0) drawFamily();
  else {
    if (trailOn) {
      if (!lastSnap || Math.abs(K - lastSnap[0]) > 0.3 || Math.abs(P - lastSnap[1]) > 0.3 || Math.abs(Q - lastSnap[2]) > 0.3) {
        trails.push({ k: K, p: P, q: Q, life: 1 }); lastSnap = [K, P, Q];
      }
    }
    trails = trails.filter(t => (t.life -= 0.0045 * DT) > 0);
    for (const t of trails) stroke(curvePath(t.k, t.p, t.q, 110), colorOf(t.k), 2.2, t.life * .6, 0);
    if (mode === 2 && (Math.abs(P) > .01 || Math.abs(Q) > .01)) {
      ctx.save(); ctx.setLineDash([6, 7]); stroke(curvePath(K, 0, 0), "rgba(200,210,235,.9)", 1.4, .45, 0); ctx.restore();
    }
    const paths = curvePath(K, P, Q), c = colorOf(K);
    if (plot) { drawPlot(); panel(); requestAnimationFrame(loop); return; }
    stroke(paths, c, 3.2, 1, 24);
    stroke(paths, "#ffffff", 1.1, .7, 0);
    if (rectOn) drawRect();
    else {
      const s = Math.sqrt(Math.abs(K)), sg = Math.sign(K) || 1;
      for (const d of [1, -1]) {
        ctx.save(); glowDot(X(P + d * s), Y(Q + d * sg * s), 4.5 + Math.sin(frame / 10), "#fff"); ctx.restore();
      }
    }
  }
  if (probeOn && familyT < 0) drawProbe();
  panel();
  requestAnimationFrame(loop);
}

let lastPanel = "";
function panel() {
  const kr = Math.round(K * 2) / 2 || (K < 0 ? -0.5 : 0.5), c = colorOf(K);
  const p = Math.round(P * 2) / 2, q = Math.round(Q * 2) / 2;
  const key = [mode, kr, p, q, familyT >= 0].join();
  if (key === lastPanel) return; lastPanel = key;
  $("kv").textContent = fmt(kr); $("kv").style.color = c; $("pv").textContent = fmt(Pt); $("qv").textContent = fmt(Qt);
  const fam = familyT >= 0;
  const den = mode === 1 || p === 0 ? "<i>x</i>" : `<i>x</i> <span class="pc">${p > 0 ? "−" : "+"} ${fmt(Math.abs(p))}</span>`;
  const qTxt = mode === 1 || q === 0 ? "" : ` <span class="pc">${q > 0 ? "+" : "−"} ${fmt(Math.abs(q))}</span>`;
  $("eq").innerHTML = `<i>y</i> = <span class="frac kc" style="color:${fam ? "#fff" : c}"><span>${fam ? "<i>k</i>" : fmt(kr)}</span><span style="color:var(--txt)">${den}</span></span>${qTxt}`;
  const rows = mode === 1 ? [
    ["그래프 위치", fam ? "k&gt;0: 1·3 / k&lt;0: 2·4사분면" : (kr > 0 ? "제1, 3사분면" : "제2, 4사분면")],
    ["|k|가 커지면", "원점에서 멀어진다"],
    ["점근선", "<i>x</i> = 0, <i>y</i> = 0"],
    ["대칭", "원점, <i>y</i> = <i>x</i>, <i>y</i> = −<i>x</i>"],
  ] : [
    ["점근선", `<i>x</i> = ${fmt(p)}, <i>y</i> = ${fmt(q)}`],
    ["대칭의 중심", `(${fmt(p)}, ${fmt(q)})`],
    ["정의역", `<i>x</i> ≠ ${fmt(p)}인 실수`],
    ["치역", `<i>y</i> ≠ ${fmt(q)}인 실수`],
  ];
  $("info").innerHTML = rows.map(r => `<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
}

function flash(txt) {
  $("big").innerHTML = txt; $("big").classList.add("show");
  clearTimeout(bigTimer); bigTimer = setTimeout(() => $("big").classList.remove("show"), 2400);
}
function stopAll() { if (typeof plot !== 'undefined' && plot) endPlot();
  stopAll0(); }
function stopAll0() { sweeping = false; $("sweep").classList.remove("on"); familyT = -1; $("family").classList.remove("on"); lastPanel = ""; }
function setK(v) {
  stopAll(); if (v === 0) v = Kt > 0 ? -0.5 : 0.5;
  const before = Kt; Kt = v; $("k").value = v;
  if (Math.sign(before) !== Math.sign(v)) flash(v > 0 ? `<span style="color:${POS}">k &gt; 0</span> → 제1, 3사분면` : `<span style="color:${NEG}">k &lt; 0</span> → 제2, 4사분면`);
}

$("k").oninput = e => setK(+e.target.value);
document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => setK(+b.dataset.k));
$("p").oninput = e => { if (plot) endPlot(); Pt = +e.target.value; $("pv").textContent = fmt(Pt); };
$("q").oninput = e => { if (plot) endPlot(); Qt = +e.target.value; $("qv").textContent = fmt(Qt); };
$("sweep").onclick = () => {
  const on = !sweeping; stopAll(); sweeping = on; $("sweep").classList.toggle("on", on);
  if (on) { sweepT = Math.asin(Math.max(-1, Math.min(1, K / 7.5))); flash("|k|가 커질수록 원점에서 멀어진다"); }
  else { Kt = Math.round(K * 2) / 2 || 0.5; $("k").value = Kt; }
};
$("family").onclick = () => {
  const on = familyT < 0; stopAll();
  if (on) { familyT = 0; $("family").classList.add("on"); trails = []; }
};
$("rect").onclick = () => { rectOn = !rectOn; $("rect").classList.toggle("on", rectOn); if (rectOn) flash("직사각형의 넓이는 언제나 |k|"); };
$("trail").onclick = () => { trailOn = !trailOn; $("trail").classList.toggle("on", trailOn); if (!trailOn) trails = []; };
$("clear").onclick = () => { trails = []; lastSnap = null; };
$("slide").onclick = () => {
  stopAll();
  const tp = +$("p").value, tq = +$("q").value;
  P = 0; Q = 0; Pt = tp; Qt = tq; trails = [];
  flash(`<i>x</i>축 방향으로 ${fmt(tp)}, <i>y</i>축 방향으로 ${fmt(tq)}만큼`);
};

function togglePause() {
  if (!plot) return startPlot();
  if (plot.doneT && plot.t > plot.doneT) return endPlot();      // 다 그린 뒤 누르면 원래 화면으로
  plot.paused = !plot.paused; syncPause();
}
function stepPlot(d) {                                      // 멈춘 상태에서 한 점씩 앞뒤로
  const n = plot.pts.length, cur = Math.max(0, Math.min(n + 1, Math.floor((plot.t - plot.lead) / plot.STEP) + 1 + (plot.t > plot.doneT ? 1 : 0)));
  const nx = Math.max(1, Math.min(n + 1, cur + d));
  plot.t = nx > n ? plot.doneT + 121 : plot.lead + (nx - 1) * plot.STEP + 16;
}
$("plot").onclick = togglePause;
$("sPrev").onclick = () => { if (!plot) return; plot.paused = true; syncPause(); stepPlot(-1); };
$("sNext").onclick = () => { if (!plot) return; plot.paused = true; syncPause(); stepPlot(1); };
$("sPause").onclick = () => { if (!plot) return; if (plot.doneT && plot.t > plot.doneT) return endPlot(); plot.paused = !plot.paused; syncPause(); };
function syncPause() { const t = plot && plot.paused ? "계속 ▶" : "일시정지 ‖"; $("sPause").textContent = t; $("plot").textContent = plot ? t : "점 찍어 그리기 ▶"; }

function zoomTo(z) { Zt = Math.max(0.03, Math.min(4, z)); trails = []; lastSnap = null; }
$("zin").onclick = () => zoomTo(Zt * 1.6);
$("zout").onclick = () => zoomTo(Zt / 1.6);
$("zreset").onclick = () => { zoomTo(1); probeOn = false; $("asym").classList.remove("on"); };
$("asym").onclick = () => {
  probeOn = !probeOn; $("asym").classList.toggle("on", probeOn);
  if (probeOn) { stopAll(); zoomTo(0.15); flash("멀리 갈수록 곡선은 점근선에 한없이 가까워진다"); }
  else zoomTo(1);
};
cv.addEventListener("wheel", e => { e.preventDefault(); zoomTo(Zt * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });

function setMode(m) {
  stopAll(); mode = m; trails = [];
  $("t1").classList.toggle("on", m === 1); $("t2").classList.toggle("on", m === 2);
  $("pqBox").classList.toggle("hide", m === 1); $("slide").classList.toggle("hide", m === 1); $("family").classList.toggle("hide", m === 2);
  if (m === 1) { Pt = 0; Qt = 0; }
  else { $("p").value = 2; $("q").value = 1; P = 0; Q = 0; Pt = 2; Qt = 1; }
}
$("t1").onclick = () => { if (plot) endPlot(); setMode(1); };
$("t2").onclick = () => { if (plot) endPlot(); setMode(2); };

addEventListener("keydown", e => {
  if (e.code === "KeyP") { e.preventDefault(); if (plot) togglePause(); else startPlot(); return; }
  if (plot && plot.paused && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); stepPlot(e.key === "ArrowRight" ? 1 : -1); return; }
  if (e.target.tagName === "INPUT" && e.key.startsWith("Arrow")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") setK(Math.min(8, Math.round(Kt * 2) / 2 + .5));
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") setK(Math.max(-8, Math.round(Kt * 2) / 2 - .5));
  if (e.key === "+" || e.key === "=") zoomTo(Zt * 1.6);
  if (e.key === "-") zoomTo(Zt / 1.6);
  if (e.key === " ") { e.preventDefault(); $("sweep").click(); }
  if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
addEventListener("resize", resize);
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
